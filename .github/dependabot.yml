version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react-native:
        patterns:
          - react
          - react-native
          - '@react-native*'
          - '@react-navigation*'
    ignore:
      # React Native minor upgrades need a matching template update and native
      # project changes. Handle these deliberately.
      - dependency-name: react-native
        update-types: ['version-update:semver-minor', 'version-update:semver-major']

      # The React Native 0.88 toolchain is pinned to these major versions.
      # Major bumps need to land together with a React Native upgrade:
      #  - Babel 8 is not supported by @react-native/babel-preset 0.88
      #  - ESLint 10 requires flat config and @react-native/eslint-config
      #    only supports ESLint 8/9
      #  - TypeScript 7 is outside typescript-eslint's supported range
      #  - Jest 30 is not supported by @react-native/jest-preset 0.88
      #  - React 20 must match the React Native release
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']
      - dependency-name: '@babel/preset-env'
        update-types: ['version-update:semver-major']
      - dependency-name: '@babel/runtime'
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: jest
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/jest'
        update-types: ['version-update:semver-major']
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-test-renderer
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
